{{- /* Warm SVG placeholder used until a real photo is added. Context: dog name string */ -}}

    <linearGradient id="g{{ . | urlize }}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7dcc6"/>
