{{- /* Warm dossier-style placeholder for the hero image until a real photo is added.
       Set hero.image in content/_index.md to replace it. Context: alt-text string. */ -}}
<svg viewBox="0 0 480 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="{{ . | default "Photo coming soon" }}" style="display:block">
  <defs>
    <linearGradient id="heroph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7dcc6"/>
      <stop offset="1" stop-color="#cdb98f"/>
    </linearGradient>
  </defs>
  <rect width="480" height="600" fill="url(#heroph)"/>
  {{/* horizon / ground line, sketched */}}
  <line x1="0" y1="440" x2="480" y2="440" stroke="#223b31" stroke-opacity="0.14" stroke-width="2"/>
  {{/* sitting dog silhouette */}}
  <g fill="#223b31" fill-opacity="0.82" transform="translate(150 210)">
    <path d="M96 30c4-14 14-24 20-22 5 2 6 14 3 26 8 10 13 24 13 40v92c0 12-9 22-21 22h-9c-6 0-11-3-14-8-4 5-9 8-15 8H36c-11 0-20-9-20-20 0-8 4-15 11-19-9-9-15-22-15-37 0-10 3-20 9-28-4-11-3-22 2-24 6-2 15 7 20 20 8-4 17-6 26-6 5 0 9 .5 14 1.5 1.5-5 4.5-10 8-15Z"/>
  </g>
  {{/* small paw motif, lower right */}}
  <g fill="#d9922f" fill-opacity="0.9" transform="translate(360 500) scale(2.6)">
    <path d="M4 6.5c-.6-1.3-.3-2.4.1-2.6.6-.3 1.9.3 2.7 1.3.7-.3 1.4-.4 2.1-.4s1.5.1 2.1.4c.8-1 2.1-1.6 2.7-1.3.4.2.7 1.3.1 2.6.7.9 1.2 1.9 1.2 3.1 0 1.1-.4 2.1-1 2.9.2.5.3 1 .3 1.5 0 2.6-2.5 4.4-5.5 4.4S3.6 20 3.6 17.5c0-.5.1-1 .3-1.5-.6-.8-1-1.8-1-2.9 0-1.2.5-2.2 1.2-3.1Z"/>
  </g>
  <text x="30" y="560" font-family="'IBM Plex Mono', monospace" font-size="14" letter-spacing="2" fill="#7b7161">{{ T "photo_coming" | upper }}</text>
</svg>
