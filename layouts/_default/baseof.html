<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default site.Language.Lang | default "en" }}">
{{ partial "head.html" . }}
<body>
  <a href="#main" class="skip-link">{{ T "skip_to_content" }}</a>
  {{ partial "header.html" . }}
  {{ partial "translation-notice.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    // Mobile nav toggle
    (function () {
      var header = document.querySelector('.site-header');
      var btn = document.querySelector('.nav-toggle');
      if (!btn || !header) return;
      btn.addEventListener('click', function () {
        var open = header.getAttribute('data-open') === 'true';
        header.setAttribute('data-open', String(!open));
        btn.setAttribute('aria-expanded', String(!open));
      });
      header.querySelectorAll('.nav a').forEach(function (a) {
        a.addEventListener('click', function () { header.setAttribute('data-open', 'false'); btn.setAttribute('aria-expanded', 'false'); });
      });
    })();
  </script>
</body>
</html>
