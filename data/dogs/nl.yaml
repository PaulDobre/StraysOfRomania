# Dieren beschikbaar voor ADOPTIE OP AFSTAND (een terugkerend abonnement dat
# de zorg voor de hond binnen ons partnernetwerk financiert). Fysieke opvang/adoptie
# wordt geregeld door de partner-ngo's en particulieren die voor elke hond zorgen.
#
# Velden:
#   photo:         pad onder /static (bijv. /img/dogs/luca.jpg). Leeg = tijdelijke afbeelding.
#   carer:         de partner-ngo of het opvanggezin dat momenteel voor de hond zorgt.
#   monthly:       optioneel voorgesteld maandbedrag (EUR) voor deze hond.
#   subscribe_url: optionele abonnementslink per hond. Indien leeg, verwijst de knop
#                  naar params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
dogs:
