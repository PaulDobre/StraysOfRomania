# Djur tillgängliga för FJÄRRADOPTION (en återkommande prenumeration som
# finansierar hundens omsorg inom vårt partnernätverk). Fysiskt jourhem/adoption
# hanteras av partnerorganisationerna och de personer som tar hand om varje hund.
#
# Fält:
#   photo:         sökväg under /static (t.ex. /img/dogs/luca.jpg). Tom = platshållare.
#   carer:         partnerorganisationen eller jourhemmet som just nu vårdar hunden.
#   monthly:       valfritt föreslaget månadsbelopp (EUR) för denna hund.
#   subscribe_url: valfri prenumerationslänk per hund. Om tom länkar knappen
#                  till params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
dogs:
