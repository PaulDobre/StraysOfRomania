# Animali disponibili per l'ADOZIONE A DISTANZA (un abbonamento ricorrente che
# finanzia la cura del cane all'interno della nostra rete di partner). L'affido e
# l'adozione fisica sono gestiti dalle ONG partner e dalle persone che si prendono
# cura di ciascun cane.
#
# Campi:
#   photo:         percorso sotto /static (es. /img/dogs/luca.jpg). Vuoto = segnaposto.
#   carer:         la ONG partner o la famiglia affidataria che attualmente cura il cane.
#   monthly:       importo mensile suggerito facoltativo (EUR) per questo cane.
#   subscribe_url: link di abbonamento facoltativo per singolo cane. Se vuoto, il pulsante
#                  rimanda a params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
dogs:
