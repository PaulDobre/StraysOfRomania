# Animaux disponibles pour le PARRAINAGE À DISTANCE (un abonnement récurrent qui finance
# les soins du chien au sein de notre réseau de partenaires). L'accueil et l'adoption réels
# sont assurés par les ONG partenaires et les particuliers qui s'occupent de chaque chien.
#
# Champs :
#   photo :         chemin sous /static (par exemple /img/dogs/luca.jpg). Vide = image générique.
#   carer :         l'ONG partenaire ou la famille d'accueil qui prend actuellement soin du chien.
#   monthly :       montant mensuel suggéré (EUR) pour ce chien, facultatif.
#   subscribe_url : lien d'abonnement propre au chien, facultatif. S'il est vide, le bouton
#                  renvoie vers params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
