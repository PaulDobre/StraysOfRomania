# Animais disponíveis para ADOÇÃO À DISTÂNCIA (uma subscrição recorrente que financia
# os cuidados do cão dentro da nossa rede de parceiros). O acolhimento/adoção físico é
# tratado pelas ONG parceiras e pelas pessoas que cuidam de cada cão.
#
# Campos:
#   photo:         caminho em /static (por exemplo, /img/dogs/luca.jpg). Vazio = imagem provisória.
#   carer:         a ONG parceira ou a família de acolhimento que atualmente cuida do cão.
#   monthly:       valor mensal sugerido (opcional, em EUR) para este cão.
#   subscribe_url: ligação de subscrição por cão (opcional). Se vazio, o botão
#                  liga a params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
