#   monthly:       volitelná doporučená měsíční částka (EUR) pro tohoto psa.
#   subscribe_url: volitelný odkaz na předplatné pro konkrétního psa. Pokud je prázdný,
#                  tlačítko odkazuje na params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
