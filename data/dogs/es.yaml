# Animales disponibles para ADOPCIÓN A DISTANCIA (una suscripción recurrente que
# financia el cuidado del perro dentro de nuestra red de organizaciones colaboradoras).
# La acogida/adopción física la gestionan las ONG colaboradoras y las personas que
# cuidan de cada perro.
#
# Campos:
#   photo:         ruta dentro de /static (p. ej. /img/dogs/luca.jpg). Vacío = marcador de posición.
#   carer:         la ONG colaboradora o la familia de acogida que cuida actualmente del perro.
#   monthly:       importe mensual sugerido opcional (EUR) para este perro.
#   subscribe_url: enlace de suscripción opcional por perro. Si está vacío, el botón
#                  enlaza a params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
dogs:
