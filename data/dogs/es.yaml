    name: Luca
    sex: Macho
    age: "2 años"
    size: Mediano
    carer: "Refugio colaborador · Bucarest"
    status: Necesita padrinos a distancia
    monthly: 15
    photo: ""
    subscribe_url: ""
    blurb: Rescatado de un refugio público el invierno pasado. Cariñoso y educado para vivir en casa — sus cuidadores cubren la comida y las facturas del veterinario, y tu adopción a distancia les permite seguir adelante.
