# Dyr til rådighed for FJERNADOPTION (et løbende abonnement, der finansierer
# hundens pleje inden for vores partnernetværk). Fysisk pleje/adoption
# varetages af de partner-ngo'er og enkeltpersoner, der passer hver hund.
#
# Felter:
#   photo:         sti under /static (f.eks. /img/dogs/luca.jpg). Tom = pladsholder.
#   carer:         partner-ngo'en eller plejeværten, der aktuelt passer hunden.
#   monthly:       valgfrit foreslået månedligt beløb (EUR) for denne hund.
#   subscribe_url: valgfrit abonnementslink pr. hund. Hvis tomt, linker knappen
#                  til params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
