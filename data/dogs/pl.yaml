# Zwierzęta dostępne do ADOPCJI ZDALNEJ (cykliczna subskrypcja, która finansuje
# opiekę nad psem w ramach naszej sieci partnerskiej). Fizyczną opieką tymczasową/adopcją
# zajmują się partnerskie organizacje pozarządowe i osoby, które opiekują się każdym psem.
#
# Pola:
#   photo:         ścieżka w /static (np. /img/dogs/luca.jpg). Puste = symbol zastępczy.
#   carer:         partnerska organizacja lub opiekun tymczasowy, który obecnie opiekuje się psem.
#   monthly:       opcjonalna sugerowana kwota miesięczna (EUR) dla tego psa.
#   subscribe_url: opcjonalny link subskrypcji dla danego psa. Jeśli pusty, przycisk
#                  prowadzi do params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
