# Tiere, die zur FERNADOPTION verfügbar sind (ein wiederkehrendes Abonnement,
# das die Versorgung des Hundes innerhalb unseres Partnernetzwerks finanziert).
# Physische Pflege/Adoption übernehmen die Partner-NGOs und Privatpersonen,
# die sich um jeden Hund kümmern.
#
# Felder:
#   photo:         Pfad unter /static (z. B. /img/dogs/luca.jpg). Leer = Platzhalter.
#   carer:         die Partner-NGO oder Pflegestelle, die den Hund derzeit betreut.
#   monthly:       optionaler vorgeschlagener Monatsbetrag (EUR) für diesen Hund.
#   subscribe_url: optionaler Abo-Link je Hund. Wenn leer, verweist der Button auf
#                  params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
