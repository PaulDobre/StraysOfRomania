# handled by the partner NGOs and individuals who look after each dog.
#
# Fields:
#   photo:         path under /static (e.g. /img/dogs/luca.jpg). Empty = placeholder.
#   carer:         the partner NGO or foster who currently cares for the dog.
#   monthly:       optional suggested monthly amount (EUR) for this dog.
#   subscribe_url: optional per-dog subscription link. If empty, the button
#                  links to params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
