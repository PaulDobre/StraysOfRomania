# Animale disponibile pentru ADOPȚIE LA DISTANȚĂ (un abonament recurent care
# finanțează îngrijirea câinelui în cadrul rețelei noastre de parteneri). Îngrijirea
# temporară / adopția fizică sunt gestionate de ONG-urile partenere și de persoanele
# care au grijă de fiecare câine.
#
# Câmpuri:
#   photo:         cale sub /static (de ex. /img/dogs/luca.jpg). Gol = imagine substitut.
#   carer:         ONG-ul partener sau îngrijitorul temporar care are grijă acum de câine.
#   monthly:       sumă lunară sugerată (EUR) pentru acest câine (opțional).
#   subscribe_url: link de abonare per câine (opțional). Dacă e gol, butonul
#                  trimite către params.remoteAdoptBaseUrl?animal=<id>&name=<name>&amount=<n>.
