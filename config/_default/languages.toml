# 14 languages. English is the default (served at /); the rest at /<lang>/.
# Translated micro-copy lives in i18n/<lang>.toml; page content in *.<lang>.md.
# `label` is shown in the language switcher; `locale` drives date formatting.

[en]
  label = "English"
  locale = "en-GB"
  weight = 1

[de]
  label = "Deutsch"
  locale = "de-DE"
  weight = 2

[fr]
  label = "Français"
  locale = "fr-FR"
  weight = 3

