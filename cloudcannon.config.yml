paths:
  static: static
  uploads: static/img
timezone: Europe/Bucharest
markdown:
  engine: commonmark
  options:
    gfm: true
    linkify: false
    table: false
    strikethrough: false
    subscript: false
    superscript: false
    heading_ids: false
    breaks: false
    xhtml: false
    attributes: false
    typographer: false
    treat_indentation_as_code: true
_snippets_imports:
  hugo:
    exclude:
      - hugo_instagram
collections_config:
  pages:
    path: ''
    icon: wysiwyg
  content:
    path: content
    icon: wysiwyg
  data_dogs:
    path: data/dogs
    icon: data_usage
  i18n:
    path: i18n
    icon: iron
  stories:
    path: content/stories
    icon: store
    glob:
      - '!_index.md'
